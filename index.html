<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%TITULO%</title>
    <meta name="description" content="%DESCRICAO%" />
    <meta name="theme-color" content="%THEME%" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Prévia do link no WhatsApp / redes (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%URL%" />
    <meta property="og:title" content="%TITULO%" />
    <meta property="og:description" content="%DESCRICAO%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Convite de aniversário de %NOME%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%OG_IMAGE%" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />

    <style>%PALETA%</style>
    <script>
      // Decide antes da primeira pintura se mostramos a moldura de celular (desktop).
      ;(function () {
        var d = document.documentElement, framed
        try { framed = window.self !== window.top } catch (e) { framed = true }
        if (framed) d.classList.add('framed')
        if (!framed && window.matchMedia && matchMedia('(min-width: 820px) and (hover: hover) and (pointer: fine)').matches) d.classList.add('desk')
        else d.classList.add('locked')
      })()
    </script>
    <!-- CSS crítico: só o necessário para a intro aparecer instantaneamente -->
    <style>
      @font-face { font-family: 'Manrope'; font-style: normal; font-weight: 200 800; font-display: swap; src: url(/fonts/manrope.woff2) format('woff2'); }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-display: swap; src: url(/fonts/instrument-serif-italic.woff2) format('woff2'); }
      @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/instrument-serif.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800; font-display: swap; src: url(/fonts/jetbrains-mono.woff2) format('woff2'); }
      html { background: var(--color-noite); color: #fff; -webkit-text-size-adjust: 100%; }
      body { margin: 0; font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      html.desk #intro { display: none; }
      html.locked, html.locked body { overflow: hidden; }

      .intro { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        min-height: 100svh; height: 100dvh; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: radial-gradient(120% 70% at 50% 45%, var(--color-ameixa) 0%, var(--color-noite) 62%, #0b0414 100%);
        overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation;
        transition: opacity .8s ease; }
      .intro:focus-visible { outline: none; }
      .intro:focus-visible .intro-cta span { outline: 3px solid var(--color-dourado); outline-offset: 6px; }
      .intro-stars { position: absolute; inset: -10%; pointer-events: none; opacity: .7;
        background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 78% 12%, #f5d48a 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 30% 72%, #d8b4fe 50%, transparent 51%), radial-gradient(1px 1px at 88% 64%, #fff 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 55% 30%, #f0abfc 50%, transparent 51%), radial-gradient(1px 1px at 18% 88%, #f5d48a 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 66% 86%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 42% 8%, #fff 50%, transparent 51%);
        animation: twinkle 4s ease-in-out infinite alternate; }
      @keyframes twinkle { from { opacity: .35 } to { opacity: .85 } }

      .cocoon-wrap { position: relative; width: 150px; height: 250px; display: grid; place-items: center; }
      .cocoon-thread { position: absolute; top: -40vh; left: 50%; width: 1px; height: calc(40vh + 30px); background: linear-gradient(to bottom, transparent, rgba(245,212,138,.6)); }
      .cocoon-glow { position: absolute; inset: -60px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(245,212,138,.55), rgba(168,85,247,.35) 45%, transparent 75%);
        animation: pulse 2.2s ease-in-out infinite; will-change: transform, opacity; }
      @keyframes pulse { 0%,100% { transform: scale(.82); opacity: .55 } 50% { transform: scale(1.05); opacity: 1 } }
      .cocoon { position: relative; width: 120px; height: 200px; overflow: visible; animation: sway 4s ease-in-out infinite; transform-origin: 50% 0; }
      @keyframes sway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
      .cocoon .half { transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .9s ease; transform-box: fill-box; }
      .cocoon .crack { stroke-dasharray: 260; stroke-dashoffset: 260; transition: stroke-dashoffset .35s ease-out; }
      .intro-burstlight { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; pointer-events: none;
        background: radial-gradient(closest-side, #fff, rgba(245,212,138,.9) 35%, rgba(240,171,252,.4) 65%, transparent); transform: scale(0); opacity: 0; }
      .intro-kicker { margin: 0; font-family: 'Great Vibes', cursive; font-size: 34px; line-height: 1.1; color: #f3e8ff; text-align: center; text-shadow: 0 0 24px rgba(168,85,247,.8); }
      .intro-cta { margin: 0; animation: fadein 1s .5s both; }
      .intro-cta span { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; font-size: 17px; font-weight: 500; letter-spacing: .02em; color: #fff;
        background: rgba(124,58,237,.28); border: 1px solid rgba(216,180,254,.45); box-shadow: 0 0 30px rgba(168,85,247,.35), inset 0 0 20px rgba(240,171,252,.15);
        animation: breathe 2.2s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }
      @keyframes fadein { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      .intro-flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #fff, #f5d48a 30%, rgba(240,171,252,.6) 60%, rgba(124,58,237,0)); opacity: 0; pointer-events: none; }

      .intro.is-opening { cursor: default; }
      .intro.is-opening .cocoon { animation: shake .32s linear 2; }
      @keyframes shake { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-6deg) translateX(-3px) } 75% { transform: rotate(6deg) translateX(3px) } }
      .intro.is-opening .cocoon-glow { animation: none; transform: scale(1.25); opacity: 1; transition: transform .5s, opacity .5s; }
      .intro.is-cracked .crack { stroke-dashoffset: 0; }
      .intro.is-split .half-l { transform: translate(-46px, 18px) rotate(-32deg); opacity: 0; }
      .intro.is-split .half-r { transform: translate(46px, 18px) rotate(32deg); opacity: 0; }
      .intro.is-split .intro-cta, .intro.is-split .intro-kicker { opacity: 0; transform: translateY(16px); transition: opacity .4s, transform .4s; }
      .intro.is-split .cocoon-thread { opacity: 0; transition: opacity .4s; }
      .intro.is-split .intro-burstlight { animation: burstlight .9s ease-out forwards; }
      @keyframes burstlight { 0% { transform: scale(0); opacity: 1 } 60% { opacity: .9 } 100% { transform: scale(14); opacity: 0 } }
      .intro.is-split .intro-flash { animation: flash .9s ease-out forwards; }
      @keyframes flash { 0% { opacity: 0 } 18% { opacity: .85 } 100% { opacity: 0 } }
      .intro.is-gone { opacity: 0; pointer-events: none; }

      /* Borboleta SVG reutilizável (revoadas) */
      .bfly { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; will-change: transform, opacity; }
      .bfly .wl, .bfly .wr { transform-box: view-box; transform-origin: 0 0; animation: flap .22s ease-in-out infinite alternate; }
      .bfly .wl { animation-name: flapl; }
      @keyframes flap { from { transform: scaleX(1) } to { transform: scaleX(.18) } }
      @keyframes flapl { from { transform: scaleX(1) } to { transform: scaleX(.18) } }

      @media (prefers-reduced-motion: reduce) {
        .intro *, .intro { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="intro" class="intro" role="button" tabindex="0">
      <div class="intro-stars" aria-hidden="true"></div>
      <div class="cocoon-wrap" aria-hidden="true">
        <div class="cocoon-thread"></div>
        <div class="cocoon-glow"></div>
        <svg class="cocoon" viewBox="0 0 120 200">
          <defs>
            <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fdf4ff" />
              <stop offset=".45" stop-color="#d8b4fe" />
              <stop offset="1" stop-color="#7c3aed" />
            </linearGradient>
            <linearGradient id="cs" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".55" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g class="half half-l">
            <path d="M60 8 C34 14 18 52 18 100 C18 150 36 188 60 194 L60 8 Z" fill="url(#cg)" />
            <path d="M24 70 Q42 66 60 74 M20 104 Q40 98 60 106 M24 138 Q42 132 60 140 M34 168 Q48 164 60 170" stroke="#fff" stroke-opacity=".35" stroke-width="2" fill="none" />
          </g>
          <g class="half half-r">
            <path d="M60 8 C86 14 102 52 102 100 C102 150 84 188 60 194 L60 8 Z" fill="url(#cg)" />
            <path d="M96 70 Q78 66 60 74 M100 104 Q80 98 60 106 M96 138 Q78 132 60 140 M86 168 Q72 164 60 170" stroke="#fff" stroke-opacity=".25" stroke-width="2" fill="none" />
          </g>
          <ellipse cx="44" cy="70" rx="10" ry="34" fill="url(#cs)" />
          <path class="crack" d="M60 14 L54 40 L66 62 L52 92 L68 118 L54 146 L64 172 L60 192" stroke="#fff7d6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 6px #f5d48a)" />
        </svg>
        <div class="intro-burstlight"></div>
      </div>
      <p class="intro-kicker">Um convite mágico para você</p>
      <p class="intro-cta"><span>✨ Toque para abrir</span></p>
      <div class="intro-flash" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <noscript><p style="padding:24px;text-align:center">Ative o JavaScript para ver o convite de %NOME% 🦋</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
